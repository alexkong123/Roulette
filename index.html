<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>輪盤打珠器 · 自由邊界下注與組合注</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#061f13;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }

  /* 核心佈局：上下分層，保證不互相遮擋 */
  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    position: relative;
  }

  /* ================= 中心輪盤區 ================= */
  #canvas-container {
    flex: 1;
    position: relative;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #c{display:block;width:100%;height:100%;touch-action:none}

  /* ================= 懸浮 UI 元素 ================= */
  #controls{
    position:absolute;
    top:calc(14px + env(safe-area-inset-top,0px));
    left:0;right:0;
    display:flex;
    justify-content:space-between;
    padding:0 16px;
    pointer-events:none;
    z-index:10;
  }
  .dir-btn{
    pointer-events:auto;
    padding:10px 18px;
    border-radius:22px;
    border:1px solid rgba(212,175,55,0.38);
    background:rgba(18,24,34,0.80);
    color:rgba(228,236,248,0.92);
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    letter-spacing:0.5px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:background .2s,color .2s,box-shadow .2s,border-color .2s,opacity .2s;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    outline:none;
  }
  .dir-btn:disabled{opacity:0.32;cursor:default}
  .dir-btn.active{
    background:linear-gradient(135deg,rgba(212,175,55,0.95),rgba(178,143,44,0.95));
    color:#12161e;
    border-color:rgba(255,238,190,0.95);
    box-shadow:0 0 16px rgba(212,175,55,0.40);
  }

  #settle-panel {
    position: absolute;
    top: calc(66px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: rgba(18, 24, 34, 0.88);
    border: 1px solid rgba(212, 175, 55, 0.5);
    border-radius: 12px;
    padding: 8px 12px;
    z-index: 9;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
  }

  .settle-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }

  .settle-title {
    font-size: 13px;
    font-weight: 700;
    color: #eee;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .settle-details {
    font-size: 11px;
    color: #aaa;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 48px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .settle-details::-webkit-scrollbar { display: none; }

  .win-tag {
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
    white-space: nowrap;
    font-weight: bold;
  }

  .balance-box {
    text-align: right;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  .balance-label {
    font-size: 10px;
    color: #888;
    letter-spacing: 1px;
  }
  .balance-value {
    font-size: 18px;
    font-weight: 700;
    color: #f5e036;
    font-family: monospace;
  }

  /* ================= 歷史紀錄區 ================= */
  #history-container {
    height: 38px;
    background: rgba(0,0,0,0.15);
    border-top: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  #history-bar {
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    width: 100%;
    max-width: 900px;
    justify-content: flex-start;
  }
  #history-bar::-webkit-scrollbar { display: none; }
  
  .history-item {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    border: 1.5px solid rgba(255,255,255,0.15);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .history-item.red { background: #b02c1c; border-color: #ff6b5b; }
  .history-item.black { background: #1a1d24; border-color: #6b7280; }
  .history-item.green { background: #166534; border-color: #4ade80; }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ================= 底部投注區 ================= */
  #betting-area {
    background: linear-gradient(180deg, #1e3f6e 0%, #15294a 100%);
    padding: 16px 10px calc(16px + env(safe-area-inset-bottom, 0px)) 10px;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 20;
  }

  #chip-area {
    position: absolute;
    left: clamp(10px, 3vw, 40px);
    bottom: clamp(10px, 3vh, 30px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
    align-items: center;
    width: clamp(55px, 9vw, 75px);
    background: rgba(0,0,0,0.3);
    padding: 10px 6px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
  }

  #btnClearBets {
    width: 100%;
    padding: 6px 0;
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.8);
    color: #fca5a5;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    text-align: center;
  }
  #btnClearBets:active {
    background: rgba(239, 68, 68, 0.5);
    color: #fff;
  }

  .chip-pool {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    width: 100%;
    justify-items: center;
  }

  .chip {
    width: clamp(22px, 3.5vw, 32px);
    height: clamp(22px, 3.5vw, 32px);
    border-radius: 50%;
    box-shadow: 
      0 3px 6px rgba(0,0,0,0.5), 
      inset 0 2px 4px rgba(255,255,255,0.5),
      inset 0 -2px 4px rgba(0,0,0,0.4);
    position: relative;
    border: 2px solid rgba(255,255,255,0.85);
    cursor: grab;
    transition: transform 0.1s;
    touch-action: none;
  }
  .chip::after {
    content: '';
    position: absolute;
    top: 15%; left: 15%; right: 15%; bottom: 15%;
    border-radius: 50%;
    border: 1.5px dashed rgba(255,255,255,0.6);
    pointer-events: none;
  }

  .chip.c1 { background: radial-gradient(circle at 30% 30%, #ff6b6b, #dc2626); }
  .chip.c2 { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); }
  .chip.c3 { background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a); }
  .chip.c4 { background: radial-gradient(circle at 30% 30%, #4b5563, #111827); }
  .chip.c5 { background: radial-gradient(circle at 30% 30%, #c084fc, #7e22ce); }
  .chip.c6 { background: radial-gradient(circle at 30% 30%, #fde047, #ca8a04); }
  .chip.c7 { background: radial-gradient(circle at 30% 30%, #f472b6, #be185d); }
  .chip.c8 { background: radial-gradient(circle at 30% 30%, #fb923c, #ea580c); }

  .betting-board {
    position: relative;
    display: grid;
    grid-template-columns: 1.5fr repeat(12, 1fr) 1.5fr;
    grid-template-rows: repeat(2, 0.6fr) repeat(3, 1fr);
    gap: 1.5px;
    background-color: #f5e036;
    border: 3px solid #f5e036;
    border-radius: 8px;
    overflow: hidden;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 2.4 / 1;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }

  .cell {
    background-color: #3065a8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(14px, 2.2vw, 20px);
    color: #111;
    user-select: none;
    transition: background-color 0.1s;
  }
  .cell:hover:not(.cell-empty) { background-color: #3a78c5; }
  
  .cell.red { color: #ff4747; }
  .cell.black { color: #111; }
  
  .cell-0 {
    grid-column: 1;
    grid-row: 3 / span 3;
    font-size: clamp(24px, 4.5vw, 36px);
    color: #f5e036; 
  }

  .cell-2to1 {
    grid-column: 14;
    grid-row: auto;
    font-size: clamp(10px, 1.8vw, 14px);
  }

  .cell-bottom-12 { font-size: clamp(13px, 2vw, 18px); }
  .cell-bottom-half { font-size: clamp(13px, 2vw, 18px); }

  .diamond-icon {
    display: inline-block;
    width: 16px;
    height: 16px;
    transform: rotate(45deg);
    border: 2px solid currentColor;
    pointer-events: none;
  }
  .diamond-icon.red { border-color: #ff4747; }
  .diamond-icon.black { border-color: #111; }

  #bet-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .chip-on-board {
    position: absolute;
    width: clamp(16px, 2.5vw, 22px);
    height: clamp(16px, 2.5vw, 22px);
    transform: translate(-50%, -50%);
    box-shadow: 0 3px 6px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,255,0.6), inset 0 -1px 3px rgba(0,0,0,0.5);
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.9);
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    z-index: 11;
  }
  .chip-on-board::after {
    content: '';
    position: absolute;
    top: 15%; left: 15%; right: 15%; bottom: 15%;
    border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.7);
    pointer-events: none;
  }

  #drag-layer {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }
  .drag-ghost {
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.1);
    box-shadow: 0 8px 16px rgba(0,0,0,0.6);
  }

  @media (max-width: 768px) {
    #betting-area { 
      padding: 10px 4px calc(10px + env(safe-area-inset-bottom, 0px)) 4px; 
      flex-direction: row;
      align-items: flex-end;
    }
    #chip-area {
      position: relative;
      left: 0; bottom: 0;
      width: clamp(45px, 12vw, 60px);
      background: transparent;
      padding: 0;
      border: none;
      backdrop-filter: none;
      margin-right: 6px;
    }
    .betting-board {
      width: calc(100% - 70px);
      aspect-ratio: 2.0 / 1; 
    }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-container">
    <canvas id="c"></canvas>
    
    <div id="controls">
      <button id="btnLeft"  class="dir-btn">← 向左轉</button>
      <button id="btnRight" class="dir-btn active">向右轉 →</button>
    </div>

    <div id="settle-panel">
      <div class="settle-info">
        <div class="settle-title" id="settle-title">等待開獎</div>
        <div class="settle-details" id="settle-details">請下注並打珠</div>
      </div>
      <div class="balance-box">
        <div class="balance-label">本局中獎</div>
        <div class="balance-value" id="win-value">$ 0</div>
      </div>
    </div>
  </div>

  <div id="history-container">
    <div id="history-bar"></div>
  </div>

  <div id="betting-area">
    <div class="betting-board" id="board"></div>
    <div id="chip-area">
      <button id="btnClearBets">清空投注</button>
      <div class="chip-pool" id="chip-pool"></div>
    </div>
  </div>
</div>
<div id="drag-layer"></div>

<script>
(function(){
'use strict';

/* ============================================================
   幾何常量
   ============================================================ */
const D = {
  R_OUT:      360,
  R_NUM_OUT:  280,
  R_NUM_IN:   210,
  R_TRACK:    345,
  R_HUB:      160,
  R_LAND:     185,
  BALL:       8.5,
};

const R_OBSTACLE = 312.5;
const SECT = 37;
const STEP = Math.PI * 2 / SECT;
const TAU  = Math.PI * 2;

const ORDER = [
  0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 
  5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26
];

const REDS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

function sectorColor(num) {
  if (num === 0) return 'green';
  return REDS.has(num) ? 'red' : 'black';
}

const CHIP_COLORS = {
  1: { name: '紅色', hex: '#dc2626' },
  2: { name: '藍色', hex: '#2563eb' },
  3: { name: '綠色', hex: '#16a34a' },
  4: { name: '黑色', hex: '#111827' },
  5: { name: '紫色', hex: '#7e22ce' },
  6: { name: '黃色', hex: '#ca8a04' },
  7: { name: '粉色', hex: '#be185d' },
  8: { name: '橙色', hex: '#ea580c' }
};

const OFF = 800;
const OFF_RES = 2;

const WHEEL_SPEED = 0.45;
const LAUNCH_R    = D.R_TRACK;
const LAUNCH_SNAP = 62;
const PULL_MIN    = 30;
const CHIP_VALUE  = 20;

const OBSTACLES = [];
const NUM_OBSTACLES = 8;
for (let i = 0; i < NUM_OBSTACLES; i++) {
  OBSTACLES.push({ th: (i / NUM_OBSTACLES) * TAU + 0.2 });
}

/* ============================================================
   全局狀態
   ============================================================ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const btnLeft  = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const historyBar = document.getElementById('history-bar');
const boardContainer = document.getElementById('board');
const chipArea = document.getElementById('chip-pool');
const dragLayer = document.getElementById('drag-layer');
const winValueEl = document.getElementById('win-value');
const settleTitleEl = document.getElementById('settle-title');
const settleDetailsEl = document.getElementById('settle-details');
const btnClearBets = document.getElementById('btnClearBets');

let W = 0, H = 0, cx = 0, cy = 0, S = 1, dpr = 1;
let staticImg = null;
let numImg    = null;
let lastT = 0;

let wheelAngle = 0;
let wheelSpeed = 0;
let wheelDir   = 1;

const G = {
  phase: 'idle',
  ball: { r: 95, th: -Math.PI/2, w: 0, vr: 0, collideTimer: 0 },

  restLocalTh: null,
  restR: 95,

  dragOffX: 0,
  dragOffY: 0,

  readySide: 0,
  readyStartY: 0,
  slideY: 0,

  trail: [],
  lastPos: null,

  resultIdx: null,
  resultNum: null,
  resultColor: null,
  resultTime: 0,

  settleT: 0,
  settleLocalFrom: 0,
  settleLocalTo:   0,

  fireWheelDir: 1,
  fireDir: 1,
  invalid: false,
  lastWin: 0,

  history: [],
};

/* ============================================================
   尺寸與版面
   ============================================================ */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const container = document.getElementById('canvas-container');
  W = container.clientWidth;
  H = container.clientHeight;

  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 取得結算面板底部的位置，避免輪盤被遮擋
  const settlePanel = document.getElementById('settle-panel');
  let topOffset = 60;
  if (settlePanel) {
    const rect = settlePanel.getBoundingClientRect();
    topOffset = rect.bottom - container.getBoundingClientRect().top + 20; 
  }
  if (topOffset < 100) topOffset = 100; // 預留最小安全距離

  cx = W / 2;
  // 讓輪盤在「扣除頂部 UI 後的剩餘空間」中垂直置中
  cy = topOffset + (H - topOffset) * 0.5; 

  // 根據寬度與扣除頂部後的可用高度，計算輪盤最大縮放比
  S = Math.min(W * 0.9, (H - topOffset) * 0.85) / (D.R_OUT * 2);
  S = Math.min(S, 1.6);
}

/* ============================================================
   建立投注區 UI
   ============================================================ */
function buildBettingBoard() {
  boardContainer.innerHTML = '';
  
  chipArea.innerHTML = '';
  for (let i = 1; i <= 8; i++) {
    const chip = document.createElement('div');
    chip.className = `chip c${i}`;
    chip.dataset.color = i;
    chip.addEventListener('pointerdown', (e) => startDrag(e, 'pool', i, null));
    chipArea.appendChild(chip);
  }

  const betLayer = document.createElement('div');
  betLayer.id = 'bet-layer';
  boardContainer.appendChild(betLayer);

  const createCell = (text, className, gridCol, gridRow, isRed, betType) => {
    const cell = document.createElement('div');
    cell.className = 'cell ' + className;
    if (isRed) cell.classList.add('red');
    if (text) cell.innerHTML = text;
    if (gridCol) cell.style.gridColumn = gridCol;
    if (gridRow) cell.style.gridRow = gridRow;
    if (betType) cell.dataset.bet = betType;
    return cell;
  };

  boardContainer.appendChild(createCell('', 'cell-empty', 1, '1 / span 2', false, null));
  boardContainer.appendChild(createCell('', 'cell-empty', 14, '1 / span 2', false, null));
  boardContainer.appendChild(createCell('0', 'cell-0', 1, '3 / span 3', false, 'straight_0'));

  const row1 = [3, 6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36];
  const row2 = [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35];
  const row3 = [1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34];

  for (let i = 0; i < 12; i++) {
    const col = i + 2;
    boardContainer.appendChild(createCell(row1[i], '', col, 3, REDS.has(row1[i]), `straight_${row1[i]}`));
    boardContainer.appendChild(createCell(row2[i], '', col, 4, REDS.has(row2[i]), `straight_${row2[i]}`));
    boardContainer.appendChild(createCell(row3[i], '', col, 5, REDS.has(row3[i]), `straight_${row3[i]}`));
  }

  for (let r = 3; r <= 5; r++) {
    const colIdx = 6 - r;
    boardContainer.appendChild(createCell('2 to 1', 'cell-2to1', 14, r, false, `column_${colIdx}`));
  }

  const topRowItems = [
    { t: '1-18', bet: 'low' }, 
    { t: 'EVEN', bet: 'even' }, 
    { t: '<div class="diamond-icon red"></div>', bet: 'red' }, 
    { t: '<div class="diamond-icon black"></div>', bet: 'black' }, 
    { t: 'ODD', bet: 'odd' }, 
    { t: '19-36', bet: 'high' }
  ];
  for (let i = 0; i < 6; i++) {
    const cell = createCell(topRowItems[i].t, 'cell-bottom-half', `${2 + i*2} / span 2`, '1', false, topRowItems[i].bet);
    boardContainer.appendChild(cell);
  }

  for (let i = 1; i <= 3; i++) {
    const cell = createCell(`${i===1?'1st':i===2?'2nd':'3rd'} 12`, 'cell-bottom-12', `${2 + (i-1)*4} / span 4`, '2', false, `dozen_${i}`);
    boardContainer.appendChild(cell);
  }
}

/* ============================================================
   拖拽籌碼與座標判定
   ============================================================ */
let dragState = null;

function updateWinUI() {
  winValueEl.textContent = '$ ' + G.lastWin;
}

function getBetTypeAt(x, y) {
  const boardRect = boardContainer.getBoundingClientRect();
  
  const c3 = document.querySelector('.cell[data-bet="straight_3"]').getBoundingClientRect();
  const c34 = document.querySelector('.cell[data-bet="straight_34"]').getBoundingClientRect();
  
  const x0 = c3.left;
  const y0 = c3.top;
  const x1 = c34.right;
  const y1 = c34.bottom;
  
  const W_num = x1 - x0;
  const H_num = y1 - y0;
  const cw = W_num / 12;
  const ch = H_num / 3;
  
  if (x >= x0 - cw * 0.5 && x <= x0 + cw * 0.4) {
    const relY0 = y - y0;
    const THRESH_H = Math.min(ch * 0.15, 6);

    if (y >= y0 - ch * 0.4 && y <= y0 + THRESH_H) {
      return { bet: `corner_0_1_2_3`, name: `角注 (0,1,2,3)` };
    }
    if (Math.abs(y - (y0 + ch)) < THRESH_H) {
      return { bet: `street_0_2_3`, name: `街注 (0,2,3)` };
    }
    if (Math.abs(y - (y0 + 2 * ch)) < THRESH_H) {
      return { bet: `street_0_1_2`, name: `街注 (0,1,2)` };
    }

    if (relY0 >= THRESH_H && relY0 < ch - THRESH_H) {
      return { bet: `split_0_3`, name: `分注 (0,3)` };
    } else if (relY0 >= ch + THRESH_H && relY0 < ch * 2 - THRESH_H) {
      return { bet: `split_0_2`, name: `分注 (0,2)` };
    } else if (relY0 >= ch * 2 + THRESH_H && relY0 < ch * 3 - THRESH_H) {
      return { bet: `split_0_1`, name: `分注 (0,1)` };
    }
    
    return null; 
  }

  if (x >= x0 && x <= x1 && y < y0 && y > y0 - ch * 0.6) {
    if (x < x0 + cw * 0.4) return null;

    const col_ = (x - x0) / cw;
    const colInt_ = Math.round(col_);
    const distX_ = Math.abs(col_ - colInt_) * cw;
    const SIXLINE_THRESH = Math.min(cw * 0.2, 6);

    if (distX_ < SIXLINE_THRESH && colInt_ > 0 && colInt_ < 12) {
      const c = colInt_ - 1;
      const nums = [
        c*3+1, c*3+2, c*3+3,
        (c+1)*3+1, (c+1)*3+2, (c+1)*3+3
      ];
      return { bet: `sixline_${nums.join('_')}`, name: `六數注 (${nums.join(',')})` };
    }

    let c = Math.round(col_ - 0.5);
    if (c < 0) c = 0;
    if (c > 11) c = 11;

    const nums = [c*3+1, c*3+2, c*3+3];
    return { bet: `street_${nums.join('_')}`, name: `街注 (${nums.join(',')})` };
  }

  if (x >= x0 && x <= x1 && y > y1 && y < y1 + ch * 0.6) {
    const col_ = (x - x0) / cw;
    let c = Math.floor(col_);
    if (c < 0) c = 0;
    if (c > 11) c = 11;
    const nums = [c*3+1, c*3+2, c*3+3];
    return { bet: `street_${nums.join('_')}`, name: `街注 (${nums.join(',')})` };
  }

  if (x < x0 || x > x1 || y < y0 || y > y1) {
    const c0 = document.querySelector('.cell[data-bet="straight_0"]').getBoundingClientRect();
    if (x >= c0.left && x <= c0.right && y >= c0.top && y <= c0.bottom) {
      return { bet: 'straight_0', name: '直注 (0)' };
    }

    const dozen1 = document.querySelector('.cell[data-bet="dozen_1"]').getBoundingClientRect();
    if (y >= dozen1.top && y <= dozen1.bottom) {
      const b1 = x0 + 4 * cw;
      const b2 = x0 + 8 * cw;
      const THRESH_LINE = Math.min(cw * 0.2, 6);

      if (Math.abs(x - b1) < THRESH_LINE) {
        const nums = [4,5,6, 7,8,9];
        return { bet: `sixline_${nums.join('_')}`, name: `六數注 (${nums.join(',')})` };
      }
      if (Math.abs(x - b2) < THRESH_LINE) {
        const nums = [16,17,18, 19,20,21];
        return { bet: `sixline_${nums.join('_')}`, name: `六數注 (${nums.join(',')})` };
      }
    }

    const el = document.elementFromPoint(x, y);
    const cell = el ? el.closest('.cell') : null;
    if (cell && cell.dataset.bet && !cell.dataset.bet.startsWith('straight_')) {
      return { bet: cell.dataset.bet, name: cell.innerText.trim() };
    }
    return null;
  }

  const relX = x - x0;
  const relY = y - y0;

  const col = relX / cw;
  const row = relY / ch;

  const colInt = Math.round(col);
  const rowInt = Math.round(row);

  const distX = Math.abs(col - colInt) * cw;
  const distY = Math.abs(row - rowInt) * ch;

  const THRESH_X = Math.min(cw * 0.18, 7);
  const THRESH_Y = Math.min(ch * 0.18, 7);
  const THRESH_CORNER = Math.min(Math.min(cw, ch) * 0.20, 7);

  const getNum = (c, r) => {
    if (c < 0 || c > 11 || r < 0 || r > 2) return null;
    return c * 3 + (3 - r);
  };

  const cellCol = Math.floor(col);
  const cellRow = Math.floor(row);
  const inCellX = relX - cellCol * cw;
  const inCellY = relY - cellRow * ch;
  const distToEdgeX = Math.min(inCellX, cw - inCellX);
  const distToEdgeY = Math.min(inCellY, ch - inCellY);

  const numAtCell = getNum(cellCol, cellRow);

  if (numAtCell !== null 
      && distToEdgeX > cw * 0.22 
      && distToEdgeY > ch * 0.22) {
    return { bet: `straight_${numAtCell}`, name: `直注 (${numAtCell})` };
  }

  if (distX < THRESH_CORNER && distY < THRESH_CORNER) {
    const cR = Math.round(col);
    const rR = Math.round(row);
    const nums = [
      getNum(cR-1, rR-1), getNum(cR, rR-1),
      getNum(cR-1, rR),   getNum(cR, rR)
    ].filter(n => n !== null);
    if (nums.length === 4) {
      return { bet: `corner_${nums.join('_')}`, name: `角注 (${nums.join(',')})` };
    }
  }

  if (distX < THRESH_X) {
    const c = Math.round(col);
    const r = Math.floor(row);
    const n1 = getNum(c-1, r);
    const n2 = getNum(c, r);
    if (n1 !== null && n2 !== null) {
      return { bet: `split_${n1}_${n2}`, name: `分注 (${n1},${n2})` };
    }
  }

  if (distY < THRESH_Y) {
    const c = Math.floor(col);
    const r = Math.round(row);
    const n1 = getNum(c, r-1);
    const n2 = getNum(c, r);
    if (n1 !== null && n2 !== null) {
      return { bet: `split_${n1}_${n2}`, name: `分注 (${n1},${n2})` };
    }
  }

  if (numAtCell !== null) {
    return { bet: `straight_${numAtCell}`, name: `直注 (${numAtCell})` };
  }

  return null;
}

function startDrag(e, sourceType, colorIndex, originalChip = null) {
  e.preventDefault();
  
  const ghost = document.createElement('div');
  ghost.className = `chip c${colorIndex} drag-ghost`;
  dragLayer.appendChild(ghost);

  if (sourceType === 'board' && originalChip) {
    originalChip.style.display = 'none';
  }

  dragState = {
    sourceType,
    colorIndex,
    ghost,
    originalChip,
    startX: e.clientX,
    startY: e.clientY,
    moved: false
  };

  updateGhostPosition(e.clientX, e.clientY);
  
  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  
  if (Math.hypot(e.clientX - dragState.startX, e.clientY - dragState.startY) > 5) {
    dragState.moved = true;
  }
  updateGhostPosition(e.clientX, e.clientY);
}

function updateGhostPosition(x, y) {
  if (!dragState) return;
  dragState.ghost.style.left = x + 'px';
  dragState.ghost.style.top = y + 'px';
}

function onDragEnd(e) {
  if (!dragState) return;
  
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);

  const { sourceType, colorIndex, ghost, originalChip } = dragState;
  const boardRect = boardContainer.getBoundingClientRect();
  const isInsideBoard = 
    e.clientX >= boardRect.left && e.clientX <= boardRect.right &&
    e.clientY >= boardRect.top && e.clientY <= boardRect.bottom;
    
  if (isInsideBoard) {
    const betInfo = getBetTypeAt(e.clientX, e.clientY);
    
    if (betInfo) {
      const xPct = ((e.clientX - boardRect.left) / boardRect.width) * 100;
      const yPct = ((e.clientY - boardRect.top) / boardRect.height) * 100;
      
      if (sourceType === 'board') {
        originalChip.style.left = xPct + '%';
        originalChip.style.top = yPct + '%';
        originalChip.style.display = 'block';
        originalChip.dataset.bet = betInfo.bet;
        originalChip.dataset.betName = betInfo.name;
      } else {
        const newChip = document.createElement('div');
        newChip.className = `chip-on-board chip c${colorIndex}`;
        newChip.dataset.color = colorIndex;
        newChip.dataset.bet = betInfo.bet;
        newChip.dataset.betName = betInfo.name;
        newChip.style.left = xPct + '%';
        newChip.style.top = yPct + '%';
        
        newChip.addEventListener('pointerdown', (evt) => startDrag(evt, 'board', colorIndex, newChip));
        document.getElementById('bet-layer').appendChild(newChip);
      }
    } else {
      if (sourceType === 'board') {
        originalChip.remove();
      }
    }
  } else {
    if (sourceType === 'board') {
      originalChip.remove();
    }
  }

  ghost.remove();
  dragState = null;
}

/* ============================================================
   賠率計算與結算邏輯
   ============================================================ */
function getMultiplier(bet, result) {
  if (bet.startsWith('split_')) {
    const nums = bet.split('_').slice(1).map(Number);
    return nums.includes(result) ? 17 : 0;
  }
  if (bet.startsWith('street_')) {
    const nums = bet.split('_').slice(1).map(Number);
    return nums.includes(result) ? 11 : 0;
  }
  if (bet.startsWith('corner_')) {
    const nums = bet.split('_').slice(1).map(Number);
    return nums.includes(result) ? 8 : 0;
  }
  if (bet.startsWith('sixline_')) {
    const nums = bet.split('_').slice(1).map(Number);
    return nums.includes(result) ? 5 : 0;
  }
  
  if (bet.startsWith('straight_')) {
    const num = parseInt(bet.split('_')[1]);
    return num === result ? 35 : 0;
  }
  if (bet === 'red') return (result !== 0 && REDS.has(result)) ? 1 : 0;
  if (bet === 'black') return (result !== 0 && !REDS.has(result)) ? 1 : 0;
  if (bet === 'even') return (result !== 0 && result % 2 === 0) ? 1 : 0;
  if (bet === 'odd') return (result !== 0 && result % 2 !== 0) ? 1 : 0;
  if (bet === 'low') return (result >= 1 && result <= 18) ? 1 : 0;
  if (bet === 'high') return (result >= 19 && result <= 36) ? 1 : 0;
  if (bet === 'dozen_1') return (result >= 1 && result <= 12) ? 2 : 0;
  if (bet === 'dozen_2') return (result >= 13 && result <= 24) ? 2 : 0;
  if (bet === 'dozen_3') return (result >= 25 && result <= 36) ? 2 : 0;
  if (bet === 'column_1') return (result !== 0 && (result - 1) % 3 === 0) ? 2 : 0;
  if (bet === 'column_2') return (result !== 0 && (result - 1) % 3 === 1) ? 2 : 0;
  if (bet === 'column_3') return (result !== 0 && (result - 1) % 3 === 2) ? 2 : 0;
  
  return 0;
}

function calculateBets(resultNum, resultColor) {
  const chips = document.querySelectorAll('.chip-on-board');
  const numColorStr = resultColor === 'red' ? '紅' : resultColor === 'black' ? '黑' : '綠';
  
  if (chips.length === 0) {
    G.lastWin = 0;
    updateWinUI();
    settleTitleEl.innerHTML = `開獎結果：<span style="color:${resultColor==='red'?'#ef4444':resultColor==='black'?'#fff':'#4ade80'}">${resultNum} (${numColorStr})</span> | <span style="color:#aaa">未下注</span>`;
    settleDetailsEl.innerHTML = '';
    return;
  }

  let totalWin = 0;
  let detailsHtml = '';

  chips.forEach(chip => {
    const bet = chip.dataset.bet;
    const betName = chip.dataset.betName;
    const colorId = chip.dataset.color;
    const colorInfo = CHIP_COLORS[colorId] || { name: '未知', hex: '#fff' };
    
    if (!bet) return;
    
    const mult = getMultiplier(bet, resultNum);
    
    if (mult > 0) {
      const win = CHIP_VALUE * (mult + 1);
      totalWin += win;
      
      chip.style.boxShadow = `0 0 10px ${colorInfo.hex}, inset 0 1px 3px rgba(255,255,255,0.5)`;
      
      detailsHtml += `<span class="win-tag" style="color:${colorInfo.hex}; border-color:${colorInfo.hex}; background:rgba(255,255,255,0.1);">
        [${colorInfo.name}] ${betName} (1賠${mult}): +$${win}
      </span>`;
    } else {
      chip.remove();
    }
  });

  G.lastWin = totalWin;
  updateWinUI();

  if (totalWin > 0) {
    settleTitleEl.innerHTML = `開獎結果：<span style="color:${resultColor==='red'?'#ef4444':resultColor==='black'?'#fff':'#4ade80'}">${resultNum} (${numColorStr})</span> | <span style="color:#fbbf24;font-weight:700;">派彩 +$${totalWin}</span>`;
    settleDetailsEl.innerHTML = detailsHtml;
  } else {
    settleTitleEl.innerHTML = `開獎結果：<span style="color:${resultColor==='red'?'#ef4444':resultColor==='black'?'#fff':'#4ade80'}">${resultNum} (${numColorStr})</span> | <span style="color:#ef4444">未中獎</span>`;
    settleDetailsEl.innerHTML = '本局無中獎注項';
  }
}

btnClearBets.addEventListener('click', () => {
  document.querySelectorAll('.chip-on-board').forEach(c => c.remove());
  G.lastWin = 0;
  updateWinUI();
  settleTitleEl.innerHTML = '等待開獎';
  settleDetailsEl.innerHTML = '已清空投注區';
});

/* ============================================================
   靜態層與旋轉層繪製
   ============================================================ */
function buildStatic() {
  const c = document.createElement('canvas');
  c.width  = OFF * OFF_RES;
  c.height = OFF * OFF_RES;
  const g = c.getContext('2d');
  g.setTransform(OFF_RES, 0, 0, OFF_RES, 0, 0);
  g.translate(OFF / 2, OFF / 2);

  const woodGrad = g.createRadialGradient(0, 0, D.R_NUM_OUT, 0, 0, D.R_OUT);
  woodGrad.addColorStop(0, '#6b3a1a'); 
  woodGrad.addColorStop(0.5, '#8b4513');
  woodGrad.addColorStop(1, '#4a220d');
  g.beginPath();
  g.arc(0, 0, D.R_OUT, 0, TAU);
  g.fillStyle = woodGrad;
  g.fill();

  g.beginPath();
  g.arc(0, 0, D.R_OUT, 0, TAU);
  g.strokeStyle = '#d1d5db';
  g.lineWidth = 4;
  g.stroke();
  g.beginPath();
  g.arc(0, 0, D.R_OUT - 4, 0, TAU);
  g.strokeStyle = '#6b7280';
  g.lineWidth = 2;
  g.stroke();

  const trackR = D.R_TRACK;
  const trackW = 8;
  const tg = g.createRadialGradient(0, 0, trackR - trackW, 0, 0, trackR + trackW);
  tg.addColorStop(0.00, 'rgba(0,0,0,0.85)');
  tg.addColorStop(0.50, 'rgba(40,45,55,0.90)');
  tg.addColorStop(1.00, 'rgba(0,0,0,0.85)');
  g.beginPath();
  g.arc(0, 0, trackR + trackW, 0, TAU);
  g.arc(0, 0, trackR - trackW, 0, TAU, true);
  g.fillStyle = tg;
  g.fill();

  OBSTACLES.forEach((ob, i) => {
    const x = Math.cos(ob.th) * R_OBSTACLE;
    const y = Math.sin(ob.th) * R_OBSTACLE;
    
    g.save();
    g.translate(x, y);
    if (i % 2 === 0) g.rotate(ob.th);
    else g.rotate(ob.th + Math.PI / 2);
    
    g.beginPath();
    g.moveTo(0, -12);
    g.lineTo(8, 0);
    g.lineTo(0, 12);
    g.lineTo(-8, 0);
    g.closePath();
    
    const og = g.createLinearGradient(-8, -12, 8, 12);
    og.addColorStop(0, '#ffffff');
    og.addColorStop(0.3, '#d1d5db');
    og.addColorStop(0.7, '#9ca3af');
    og.addColorStop(1, '#4b5563');
    g.fillStyle = og;
    g.fill();
    
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.lineWidth = 1.5;
    g.stroke();
    
    g.beginPath();
    g.moveTo(0, -10);
    g.lineTo(3, 0);
    g.lineTo(0, 10);
    g.lineTo(-3, 0);
    g.closePath();
    g.fillStyle = 'rgba(255,255,255,0.6)';
    g.fill();
    
    g.restore();
  });

  staticImg = c;
}

function buildNumbers() {
  const c = document.createElement('canvas');
  c.width  = OFF * OFF_RES;
  c.height = OFF * OFF_RES;
  const g = c.getContext('2d');
  g.setTransform(OFF_RES, 0, 0, OFF_RES, 0, 0);
  g.translate(OFF / 2, OFF / 2);

  g.beginPath();
  g.arc(0, 0, D.R_NUM_IN, 0, TAU);
  g.arc(0, 0, D.R_HUB, 0, TAU, true);
  const goldGrad = g.createRadialGradient(0, 0, D.R_HUB, 0, 0, D.R_NUM_IN);
  goldGrad.addColorStop(0, '#f2d17c');
  goldGrad.addColorStop(1, '#b8860b');
  g.fillStyle = goldGrad;
  g.fill();

  for (let i = 0; i < SECT; i++) {
    const a = -Math.PI / 2 + (i - 0.5) * STEP;
    g.beginPath();
    g.moveTo(Math.cos(a) * D.R_HUB, Math.sin(a) * D.R_HUB);
    g.lineTo(Math.cos(a) * D.R_NUM_IN, Math.sin(a) * D.R_NUM_IN);
    g.strokeStyle = 'rgba(255,245,204,0.8)';
    g.lineWidth = 2;
    g.stroke();
  }

  g.lineWidth = 3;
  g.strokeStyle = 'rgba(255,245,204,0.9)';
  g.beginPath(); g.arc(0, 0, D.R_NUM_IN, 0, TAU); g.stroke();
  g.beginPath(); g.arc(0, 0, D.R_HUB, 0, TAU); g.stroke();

  for (let i = 0; i < SECT; i++) {
    const a0 = -Math.PI / 2 + (i - 0.5) * STEP;
    const a1 = a0 + STEP;
    const num = ORDER[i];
    const col = sectorColor(num);

    g.beginPath();
    g.arc(0, 0, D.R_NUM_OUT, a0, a1, false);
    g.arc(0, 0, D.R_NUM_IN,  a1, a0, true);
    g.closePath();

    const pg = g.createRadialGradient(0, 0, D.R_NUM_IN, 0, 0, D.R_NUM_OUT);
    if (col === 'green') {
      pg.addColorStop(0.00, '#0a4d26');
      pg.addColorStop(0.50, '#1b8a45');
      pg.addColorStop(1.00, '#0f5e2d');
    } else if (col === 'red') {
      pg.addColorStop(0.00, '#8a130f');
      pg.addColorStop(0.50, '#cf281f');
      pg.addColorStop(1.00, '#7a0c08');
    } else {
      pg.addColorStop(0.00, '#111111');
      pg.addColorStop(0.50, '#2a2a2a');
      pg.addColorStop(1.00, '#0a0a0a');
    }
    g.fillStyle = pg;
    g.fill();

    g.strokeStyle = 'rgba(212,175,55,0.6)';
    g.lineWidth = 1.2;
    g.stroke();
  }

  g.lineWidth = 3;
  g.strokeStyle = 'rgba(212,175,55,0.9)';
  g.beginPath(); g.arc(0, 0, D.R_NUM_OUT, 0, TAU); g.stroke();

  const midR = (D.R_NUM_IN + D.R_NUM_OUT) / 2 + 5;
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  for (let i = 0; i < SECT; i++) {
    const a = -Math.PI / 2 + i * STEP;
    const x = Math.cos(a) * midR;
    const y = Math.sin(a) * midR;
    const num = ORDER[i];

    g.save();
    g.translate(x, y);
    g.rotate(a + Math.PI / 2);

    g.font = num === 0
      ? '700 20px -apple-system,"Helvetica Neue",Arial,sans-serif'
      : '700 16px -apple-system,"Helvetica Neue",Arial,sans-serif';

    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.lineWidth = 3;
    g.strokeText(String(num), 0, 1);
    
    g.fillStyle = '#ffffff';
    g.fillText(String(num), 0, 1);

    g.restore();
  }

  const hubR = D.R_HUB;
  const hg = g.createRadialGradient(0, 0, 10, 0, 0, hubR);
  hg.addColorStop(0.00, '#8b4513');
  hg.addColorStop(0.70, '#5c3312');
  hg.addColorStop(1.00, '#2a1406');
  
  g.beginPath();
  g.arc(0, 0, hubR, 0, TAU);
  g.fillStyle = hg;
  g.fill();

  g.lineWidth = 1.5;
  g.strokeStyle = 'rgba(0,0,0,0.2)';
  for (let i = 1; i <= 4; i++) {
    g.beginPath();
    g.arc(0, 0, i * 30, 0, TAU);
    g.stroke();
  }

  g.lineWidth = 2;
  g.strokeStyle = 'rgba(212,175,55,0.8)';
  g.beginPath(); g.arc(0, 0, hubR, 0, TAU); g.stroke();

  const numSpokes = 3;
  for (let i = 0; i < numSpokes; i++) {
    const angle = i * (TAU / numSpokes) - Math.PI / 2;
    g.save();
    g.rotate(angle);

    const spokeLen = hubR - 15; 
    const spokeW = 6;
    
    const spokeGrad = g.createLinearGradient(0, 0, spokeLen, 0);
    spokeGrad.addColorStop(0, '#d4af37');
    spokeGrad.addColorStop(0.5, '#fff5cc');
    spokeGrad.addColorStop(1, '#b8860b');
    
    g.beginPath();
    g.moveTo(0, -spokeW);
    g.lineTo(spokeLen - 10, -spokeW * 0.5);
    g.lineTo(spokeLen - 10, spokeW * 0.5);
    g.lineTo(0, spokeW);
    g.closePath();
    g.fillStyle = spokeGrad;
    g.fill();
    
    const ballR = 8;
    const bg = g.createRadialGradient(spokeLen - 5, -5, 2, spokeLen, 0, ballR);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.3, '#fff5cc');
    bg.addColorStop(1, '#b8860b');
    
    g.beginPath();
    g.arc(spokeLen, 0, ballR, 0, TAU);
    g.fillStyle = bg;
    g.fill();
    g.strokeStyle = 'rgba(139,69,19,0.8)';
    g.lineWidth = 1;
    g.stroke();
    
    g.restore();
  }

  const centerR = 22;
  const cg = g.createRadialGradient(-8, -8, 4, 0, 0, centerR);
  cg.addColorStop(0.00, '#ffffff');
  cg.addColorStop(0.30, '#fff5cc');
  cg.addColorStop(0.70, '#d4af37');
  cg.addColorStop(1.00, '#8b6508');
  
  g.beginPath();
  g.arc(0, 0, centerR, 0, TAU);
  g.fillStyle = cg;
  g.fill();
  
  g.lineWidth = 2;
  g.strokeStyle = 'rgba(139,69,19,0.8)';
  g.stroke();

  g.beginPath();
  g.arc(-6, -6, 4, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.fill();

  numImg = c;
}

/* ============================================================
   物理與更新
   ============================================================ */
function updateWheel(dt) {
  const target = wheelDir * WHEEL_SPEED;
  wheelSpeed += (target - wheelSpeed) * Math.min(1, dt * 5);
  wheelAngle += wheelSpeed * dt;
}

function checkObstacleCollision(b, dt) {
  if (b.collideTimer > 0) {
    b.collideTimer -= dt;
    return;
  }

  if (b.r < R_OBSTACLE - 12 || b.r > R_OBSTACLE + 12) return;
  
  for (let i = 0; i < OBSTACLES.length; i++) {
    const ob = OBSTACLES[i];
    let dTh = b.th - ob.th;
    dTh = dTh - TAU * Math.round(dTh / TAU);
    
    const threshold = 18 / R_OBSTACLE; 
    
    if (Math.abs(dTh) < threshold) {
      b.vr = -Math.random() * 12 - 6; 
      const sgn = Math.sign(b.w) || 1;
      b.w = -sgn * (Math.random() * 2.5 + 1); 
      b.th += (Math.random() - 0.5) * 0.06;
      b.collideTimer = 0.1;
      break;
    }
  }
}

function update(dt) {
  updateWheel(dt);
  const b = G.ball;

  if (G.phase === 'idle') {
    if (G.restLocalTh !== null) {
      b.th = G.restLocalTh + wheelAngle;
      b.r  = G.restR;
    } else {
      b.th = -Math.PI / 2;
      b.r  = 95;
    }
    return;
  }

  if (G.phase === 'drag' || G.phase === 'ready') return;

  if (G.phase === 'spin') {
    const sgn = Math.sign(b.w) || 1;
    b.w -= sgn * 7.0 * dt;
    if (Math.sign(b.w) !== sgn) b.w = 0;

    b.th += b.w * dt;
    b.r = D.R_TRACK; 

    if (Math.abs(b.w) < 3.5) {
      G.phase = 'drop';
      b.vr = 0;
    }
    
    checkObstacleCollision(b, dt);
    pushTrail();
    return;
  }

  if (G.phase === 'drop') {
    const sgn = Math.sign(b.w) || 1;
    b.w -= sgn * 1.5 * dt; 
    if (Math.sign(b.w) !== sgn && Math.abs(b.w) < 0.2) b.w = 0;

    b.th += b.w * dt;

    b.vr += 180 * dt;
    b.r  -= b.vr * dt;

    checkObstacleCollision(b, dt);

    if (b.r < D.R_NUM_IN && b.r > D.R_LAND + 2) {
      let localTh = b.th - wheelAngle;
      let t = localTh + Math.PI / 2;
      t = ((t % TAU) + TAU) % TAU;
      let idx = Math.round(t / STEP) % SECT;

      const centerLocal = -Math.PI / 2 + idx * STEP;
      const halfStep = STEP / 2;
      let diff = localTh - centerLocal;
      diff = diff - TAU * Math.round(diff / TAU);
      const margin = 0.025;

      if (Math.abs(diff) > halfStep - margin) {
        if (diff > 0) localTh = centerLocal + halfStep - margin;
        else localTh = centerLocal - halfStep + margin;
        
        b.th = localTh + wheelAngle;
        b.w = -b.w * 0.4;
        b.vr += 10;
      }
    }

    if (b.r > D.R_TRACK) {
      b.r = D.R_TRACK;
      b.vr = 0; 
    }

    if (b.r <= D.R_LAND) {
      b.r = D.R_LAND;
      startSettle();
    } else {
      pushTrail();
    }
    return;
  }

  if (G.phase === 'settle') {
    G.settleT += dt;
    const k = Math.min(G.settleT / 0.22, 1);
    const e = 1 - Math.pow(1 - k, 3);

    const localTh = G.settleLocalFrom + (G.settleLocalTo - G.settleLocalFrom) * e;
    b.th = localTh + wheelAngle;
    b.r  = D.R_LAND;

    if (k >= 1) {
      G.phase = 'result';
      G.resultTime = 0;
      G.trail.length = 0;
      G.lastPos = null;

      if (!G.invalid) {
        calculateBets(G.resultNum, G.resultColor);
      } else {
        const chips = document.querySelectorAll('.chip-on-board');
        chips.forEach(c => c.remove());
        G.lastWin = 0;
        updateWinUI();
        settleTitleEl.innerHTML = `<span style="color:#ef4444;font-weight:700;">違規操作</span>`;
        settleDetailsEl.innerHTML = '本局作廢，已清除籌碼';
      }
    }
    return;
  }

  if (G.phase === 'result') {
    b.th = G.settleLocalTo + wheelAngle;
    b.r  = D.R_LAND;

    G.resultTime += dt;
    const holdTime = G.invalid ? 2.8 : 3.4;

    if (G.resultTime > holdTime) {
      G.phase = 'idle';
      G.trail.length = 0;
      G.lastPos = null;
    }
  }
}

function pushTrail() {
  const b = G.ball;
  const x = Math.cos(b.th) * b.r;
  const y = Math.sin(b.th) * b.r;

  if (G.lastPos) {
    const dist = Math.hypot(x - G.lastPos.x, y - G.lastPos.y);
    const n = Math.min(Math.ceil(dist / 9), 12);
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      G.trail.push({
        x: G.lastPos.x + (x - G.lastPos.x) * t,
        y: G.lastPos.y + (y - G.lastPos.y) * t,
      });
    }
  }
  G.trail.push({ x, y });

  while (G.trail.length > 26) G.trail.shift();
  G.lastPos = { x, y };
}

function startSettle() {
  const b = G.ball;
  const localTh = b.th - wheelAngle;

  let t = localTh + Math.PI / 2;
  t = ((t % TAU) + TAU) % TAU;
  let idx = Math.round(t / STEP) % SECT;
  if (idx < 0) idx += SECT;

  const targetLocal = -Math.PI / 2 + idx * STEP;

  let diff = targetLocal - localTh;
  diff -= TAU * Math.round(diff / TAU);

  G.settleLocalFrom = localTh;
  G.settleLocalTo   = localTh + diff;
  G.settleT = 0;

  G.resultIdx   = idx;
  G.resultNum   = ORDER[idx];
  G.resultColor = sectorColor(ORDER[idx]);

  G.restLocalTh = G.settleLocalTo;
  G.restR = D.R_LAND;

  G.phase = 'settle';
  G.trail.length = 0;
  G.lastPos = null;

  G.invalid = false;
  if (G.fireWheelDir !== 0 && G.fireDir !== -G.fireWheelDir) {
    G.invalid = true;
  }

  if (!G.invalid) {
    G.history.push({ num: G.resultNum, color: G.resultColor });
    if (G.history.length > 20) G.history.shift();
    updateHistoryUI();
  }
}

function updateHistoryUI() {
  historyBar.innerHTML = '';
  G.history.forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item ' + item.color;
    div.textContent = item.num;
    historyBar.appendChild(div);
  });
  historyBar.scrollLeft = historyBar.scrollWidth;
}

function fire(dir, power) {
  const W_MIN = 11, W_MAX = 26;
  const w0 = (W_MIN + (W_MAX - W_MIN) * power) * (0.95 + Math.random() * 0.10);

  G.fireWheelDir = wheelDir;
  G.fireDir      = dir;
  G.lastWin      = 0;
  updateWinUI();

  G.ball.th = (dir === 1) ? 0 : Math.PI;
  G.ball.r  = D.R_TRACK;
  G.ball.w  = w0 * dir;
  G.ball.vr = 0;
  G.ball.collideTimer = 0; 
  G.phase   = 'spin';
  G.trail.length = 0;
  G.lastPos = null;
  
  G.invalid = false;
}

/* ============================================================
   主繪製函數
   ============================================================ */
function draw() {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.72);
  bg.addColorStop(0.00, 'rgba(20,80,50,0.6)');
  bg.addColorStop(0.50, 'rgba(10,40,25,0.4)');
  bg.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(S, S);

  if (staticImg) ctx.drawImage(staticImg, -OFF / 2, -OFF / 2, OFF, OFF);

  ctx.save();
  ctx.rotate(wheelAngle);
  if (numImg) ctx.drawImage(numImg, -OFF / 2, -OFF / 2, OFF, OFF);
  
  if (G.resultIdx !== null && (G.phase === 'settle' || G.phase === 'result')) {
    drawHighlight();
  }
  ctx.restore();

  if (G.phase === 'idle' || G.phase === 'drag') {
    drawLaunchPoints();
  }

  drawTrail();
  drawBall();

  ctx.restore();

  drawHUD();
}

function drawHighlight() {
  const a0 = -Math.PI / 2 + (G.resultIdx - 0.5) * STEP;
  const a1 = a0 + STEP;
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);

  ctx.beginPath();
  ctx.arc(0, 0, D.R_NUM_OUT, a0, a1, false);
  ctx.arc(0, 0, D.R_NUM_IN,  a1, a0, true);
  ctx.closePath();
  ctx.fillStyle = `rgba(255,215,100,${0.10 + pulse * 0.22})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(255,228,150,${0.45 + pulse * 0.55})`;
  ctx.lineWidth = 2.6;
  ctx.stroke();
}

function drawLaunchPoints() {
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 380);
  drawOneLaunchPoint( LAUNCH_R, 0, pulse);
  drawOneLaunchPoint(-LAUNCH_R, 0, pulse);
}

function drawOneLaunchPoint(x, y, pulse) {
  ctx.beginPath();
  ctx.arc(x, y, 20 + pulse * 6, 0, TAU);
  ctx.strokeStyle = `rgba(212,175,55,${0.22 + pulse * 0.20})`;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 15, 0, TAU);
  ctx.fillStyle = 'rgba(18,24,34,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(212,175,55,0.50)';
  ctx.lineWidth = 1.4;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, y - 7);
  ctx.lineTo(x, y + 5);
  ctx.moveTo(x - 5, y);
  ctx.lineTo(x, y + 7);
  ctx.lineTo(x + 5, y);
  ctx.strokeStyle = 'rgba(255,238,190,0.85)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawTrail() {
  const tr = G.trail;
  const n = tr.length;
  for (let i = 0; i < n; i++) {
    const p = tr[i];
    const k = (i + 1) / n;
    ctx.beginPath();
    ctx.arc(p.x, p.y, D.BALL * (0.18 + k * 0.72), 0, TAU);
    ctx.fillStyle = `rgba(170,205,255,${k * 0.26})`;
    ctx.fill();
  }
}

function drawBall() {
  const b = G.ball;
  const x = Math.cos(b.th) * b.r;
  const y = Math.sin(b.th) * b.r;

  if (G.phase === 'idle' || G.phase === 'ready') {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 480);
    ctx.beginPath();
    ctx.arc(x, y, D.BALL * (1.9 + pulse * 0.55), 0, TAU);
    ctx.strokeStyle = `rgba(150,195,255,${0.42 * (1 - pulse * 0.55)})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  if (Math.abs(b.w) > 6) {
    const glow = ctx.createRadialGradient(x, y, D.BALL * 0.8, x, y, D.BALL * 3.4);
    glow.addColorStop(0, 'rgba(165,205,255,0.28)');
    glow.addColorStop(1, 'rgba(165,205,255,0)');
    ctx.beginPath();
    ctx.arc(x, y, D.BALL * 3.4, 0, TAU);
    ctx.fillStyle = glow;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(x + 2.2, y + 3.0, D.BALL, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();

  const g = ctx.createRadialGradient(
    x - D.BALL * 0.35, y - D.BALL * 0.40, D.BALL * 0.05,
    x, y, D.BALL * 1.05
  );
  g.addColorStop(0.00, '#ffffff');
  g.addColorStop(0.28, '#f2f6fb');
  g.addColorStop(0.60, '#b9c4d2');
  g.addColorStop(0.86, '#6f7d90');
  g.addColorStop(1.00, '#3d4756');

  ctx.beginPath();
  ctx.arc(x, y, D.BALL, 0, TAU);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x - D.BALL * 0.32, y - D.BALL * 0.38, D.BALL * 0.24, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();
}

function drawHUD() {
  // 只保留開獎結果的顯示，移除打珠提示與進度條
  if (G.resultNum !== null && G.phase === 'result') {
    const k = Math.min(G.resultTime / 0.28, 1);
    const ease = 1 - Math.pow(1 - k, 3);

    if (G.lastWin > 0) {
      const winK = Math.min(G.resultTime / 0.5, 1);
      const alpha = 1 - Math.abs(winK * 2 - 1);
      if (alpha > 0) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = '700 36px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fbbf24';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText('+ $' + G.lastWin, cx, cy - 100);
        ctx.restore();
      }
    }

    ctx.save();
    ctx.globalAlpha = ease;
    ctx.translate(cx, cy);
    ctx.scale(S * (0.85 + 0.15 * ease), S * (0.85 + 0.15 * ease));

    if (G.invalid) {
      ctx.beginPath();
      ctx.arc(0, 0, 76, 0, TAU);
      ctx.fillStyle = 'rgba(16, 20, 27, 0.95)';
      ctx.fill();

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(230, 196, 110, 0.95)';
      ctx.beginPath(); ctx.arc(0, 0, 76, 0, TAU); ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, 55, 0, TAU);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 12;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-38, -38);
      ctx.lineTo(38, 38);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 26px -apple-system,"PingFang HK",sans-serif';
      ctx.fillStyle = '#ef4444';
      ctx.fillText('違規操作', 0, 105);
      
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, 76, 0, TAU);
      if (G.resultColor === 'green') {
        ctx.fillStyle = 'rgba(22,110,60,0.96)';
      } else if (G.resultColor === 'red') {
        ctx.fillStyle = 'rgba(176,44,28,0.96)';
      } else {
        ctx.fillStyle = 'rgba(16,20,27,0.96)';
      }
      ctx.fill();

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = 'rgba(230,196,110,0.95)';
      ctx.beginPath(); ctx.arc(0, 0, 76, 0, TAU); ctx.stroke();

      ctx.lineWidth = 1.4;
      ctx.strokeStyle = 'rgba(255,235,180,0.35)';
      ctx.beginPath(); ctx.arc(0, 0, 66, 0, TAU); ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 66px -apple-system,"Helvetica Neue",Arial,sans-serif';

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillText(String(G.resultNum), 2, 5);

      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(G.resultNum), 0, 3);
    }
    ctx.restore();
  }
}

/* ============================================================
   交互事件
   ============================================================ */
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function ballScreenPos() {
  const b = G.ball;
  return {
    x: cx + Math.cos(b.th) * b.r * S,
    y: cy + Math.sin(b.th) * b.r * S,
  };
}

function onDown(e) {
  e.preventDefault();
  const p = getPos(e);

  if (G.phase === 'result') {
    G.phase = 'idle';
    return;
  }

  if (G.phase === 'idle') {
    const bp = ballScreenPos();
    const hitR = Math.max(38, 32 * S);
    if (Math.hypot(p.x - bp.x, p.y - bp.y) < hitR) {
      G.phase = 'drag';
      G.dragOffX = p.x - bp.x;
      G.dragOffY = p.y - bp.y;
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }
}

function onMove(e) {
  if (G.phase !== 'drag' && G.phase !== 'ready') return;
  const p = getPos(e);

  if (G.phase === 'drag') {
    const tx = p.x - G.dragOffX;
    const ty = p.y - G.dragOffY;

    const dx = (tx - cx) / S;
    const dy = (ty - cy) / S;

    let r  = Math.hypot(dx, dy);
    const th = Math.atan2(dy, dx);

    if (r > D.R_TRACK) r = D.R_TRACK;
    if (r < 2) r = 2;

    G.ball.r  = r;
    G.ball.th = th;

    const bx = Math.cos(th) * r;
    const by = Math.sin(th) * r;

    const dR = Math.hypot(bx - LAUNCH_R,  by - 0);
    const dL = Math.hypot(bx + LAUNCH_R,  by - 0);

    if (dR < LAUNCH_SNAP || dL < LAUNCH_SNAP) {
      const side = (dR < dL) ? 1 : -1;
      G.readySide  = side;
      G.ball.th    = (side === 1) ? 0 : Math.PI;
      G.ball.r     = D.R_TRACK;
      G.phase      = 'ready';
      G.readyStartY = p.y;
      G.slideY      = 0;
    }
    return;
  }

  if (G.phase === 'ready') {
    G.slideY = p.y - G.readyStartY;
  }
}

function onUp(e) {
  if (G.phase === 'ready') {
    const dist = G.slideY;
    G.slideY = 0;

    if (dist > PULL_MIN) {
      const power = Math.min(dist / (H * 0.35), 1);
      fire(G.readySide, power);
    } else {
      G.phase = 'idle';
    }
    return;
  }

  if (G.phase === 'drag') {
    G.phase = 'idle';
  }
}

/* ============================================================
   按鈕與主循環
   ============================================================ */
btnLeft.addEventListener('click', function () {
  wheelDir = -1;
  syncButtons();
});

btnRight.addEventListener('click', function () {
  wheelDir = 1;
  syncButtons();
});

let uiKey = '';
function syncButtons() {
  const locked = !(G.phase === 'idle' || G.phase === 'result');
  const key = G.phase + '|' + wheelDir + '|' + (locked ? 1 : 0);
  if (key === uiKey) return;
  uiKey = key;

  btnLeft.disabled  = locked;
  btnRight.disabled = locked;
  btnLeft.classList.toggle('active',  wheelDir === -1);
  btnRight.classList.toggle('active', wheelDir === 1);
}

function loop(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  update(dt);
  draw();
  syncButtons();

  requestAnimationFrame(loop);
}

function init() {
  resize();
  buildStatic();
  buildNumbers();
  buildBettingBoard(); 
  syncButtons();
  updateHistoryUI();
  updateWinUI();

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup',     onUp);
  canvas.addEventListener('pointercancel', onUp);

  window.addEventListener('resize', () => {
    resize();
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      resize();
    }, 120);
  });

  lastT = performance.now();
  requestAnimationFrame(loop);
}

init();

})();
</script>
